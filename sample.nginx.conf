events { }

http {
    include mime.types;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name grishma.dev www.grishma.dev;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name grishma.dev www.grishma.dev;

        # SSL certificate paths (Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/grishma.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grishma.dev/privkey.pem;

        location / {
            proxy_pass http://34.233.128.42;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}